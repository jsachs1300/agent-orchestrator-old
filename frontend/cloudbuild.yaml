steps:
  # Query the backend Cloud Run service URL
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: get-backend-url
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run services describe $_BACKEND_SERVICE_NAME \
          --region=$_BACKEND_REGION \
          --format='value(status.url)' > /workspace/backend-url.txt

  # Build with the backend URL
  - name: gcr.io/cloud-builders/docker
    id: build-image
    entrypoint: bash
    args:
      - '-c'
      - |
        API_URL=$(cat /workspace/backend-url.txt)
        echo "Building with VITE_API_BASE_URL=$API_URL"
        docker build \
          -t gcr.io/$PROJECT_ID/agent-orchestrator-frontend \
          -f Dockerfile \
          --build-arg VITE_API_BASE_URL=$API_URL \
          .

  - name: gcr.io/cloud-builders/docker
    id: push-image
    args: ["push", "gcr.io/$PROJECT_ID/agent-orchestrator-frontend"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-cloud-run
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "$_SERVICE_NAME",
        "--image",
        "gcr.io/$PROJECT_ID/agent-orchestrator-frontend",
        "--region",
        "$_REGION",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--memory",
        "512Mi",
        "--cpu",
        "1"
      ]

images:
  - gcr.io/$PROJECT_ID/agent-orchestrator-frontend

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
substitutions:
  _SERVICE_NAME: agent-orchestrator-frontend
  _REGION: us-central1
  # Configure these in your Cloud Build trigger:
  # _BACKEND_SERVICE_NAME: agent-orchestrator
  # _BACKEND_REGION: us-central1
